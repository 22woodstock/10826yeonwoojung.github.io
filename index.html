<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>드 브루인 수열과 오일러 회로를 이용한 유전체 서열 복원 탐구</title>

  <style>

    body {

      /* 배경 설정 */
      margin: 0;
      height: 100vh;

      /* 가운데 정렬 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      font-family: Arial, sans-serif;

      /* 초록 그라데이션 */
      background: linear-gradient(
        135deg,
        #b7e4c7,
        #95d5b2,
        #74c69d,
        #52b788
      );

      color: #1b4332;

      overflow: hidden;

      position: relative;
    }

    /* 흐린 배경 이미지 */
    body::before {

      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 900px;
      height: 900px;

      background:
      url("https://raw.githubusercontent.com/22woodstock/10826yeonwoojung.github.io/main/C3%2CC4%EC%8B%9D%EB%AC%BC%20%EA%B4%91%ED%95%A9%EC%84%B1%20%EA%B2%BD%EB%A1%9C%20%EB%B9%84%EA%B5%90.jpeg")
      center center no-repeat;

      background-size: contain;

      /* 흐리게 */
      opacity: 0.30;

      /* 윤곽 느낌 */
      filter: blur(2px);

      z-index: 0;
    }

    /* 글자가 배경 위로 오게 */
    h1, p, a {

      position: relative;

      z-index: 1;
    }

    /* 제목 */
    h1 {

      font-size: 60px;

      color: #0b3d2e;

      margin-bottom: 15px;
    }

    /* 부제목 */
    p {

      font-size: 24px;

      margin-bottom: 70px;
    }

    /* 버튼 */
    .project-btn {

      display: inline-block;

      padding: 18px 40px;

      background-color: #1b4332;

      color: white;

      text-decoration: none;

      font-size: 24px;

      font-weight: bold;

      border-radius: 10px;

      transition: 0.2s;

      position: relative;

      z-index: 1;
    }

    /* 마우스 올렸을 때 */
    .project-btn:hover {

      background-color: #24543f;

      transform: scale(1.05);
    }

  </style>
</head>

<body>

  <h1>드 브루인 수열과 오일러 회로를 이용한 유전체 서열 복원 탐구</h1>

  <p>
    사이언스 아카이브 포트폴리오 10826 정연우
  </p>

  <a href="project.html" class="project-btn">
    프로젝트 보기
  </a>

</body>
</html>
