<!DOCTYPE html>
<html>
<head>
  <title>c3식물과 C4식물에 대해</title>

  <style>

    body {

      /* 중요 */
      position: relative;
      overflow: hidden;

      /* 기존 그라데이션 유지 */
      background: linear-gradient(135deg, #b7e4c7, #95d5b2, #74c69d, #52b788);

      color: #1b4332;

      text-align: center;
      height: 100vh;
      margin: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
    }

    /* 흐린 배경 이미지 */
    body::before{

      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 900px;

      height: 900px;

      /* 배경 이미지 */
      background: url("C3C4비교.png") center center no-repeat;

      background-size: contain;

      /* 흐리게 */
      opacity: 0.12;

      /* 살짝 블러 */
      filter: blur(2px);

      z-index: 0;
    }

    /* 내용이 이미지 위로 올라오게 */
    h1, p, img, a{
      position: relative;
      z-index: 1;
    }

    /* 제목 */
    h1 {

      font-size: 60px;

      color: #0b3d2e;

      margin-bottom: 10px;
    }

    p{
      font-size: 22px;
      margin-bottom: 30px;
    }

    /* 메인 이미지 */
    img{

      width: 500px;

      background: transparent;

      margin-bottom: 50px;

      position: relative;
      z-index: 1;
    }

    /* 버튼 */
    .project-btn{

      display: inline-block;

      padding: 18px 40px;

      background-color: #1b4332;

      color: white;

      text-decoration: none;

      font-size: 24px;

      font-weight: bold;

      border-radius: 10px;

      transition: 0.2s;

      position: relative;
      z-index: 1;
    }

    .project-btn:hover{

      background-color: #24543f;

      transform: scale(1.05);
    }

  </style>
</head>

<body>

  <h1>C3식물과 C4식물에 대해</h1>

  <p>사이언스 아카이브 포트폴리오 10826 정연우</p>

  <!-- 기존 메인 이미지 -->
  <img src="C3C4비교.png">

  <!-- 버튼 -->
  <a href="project.html" class="project-btn">
    프로젝트 보기
  </a>

</body>
</html>
