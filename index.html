<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>드 브루인 수열과 오일러 회로를 이용한 유전체 서열 복원 탐구</title>

  <style>

    body {

      /* 배경 설정 */
      margin: 0;
      height: 100vh;

      /* 가운데 정렬 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      font-family: Arial, sans-serif;

background: linear-gradient(
  135deg,
  #020024,
  #090979,
  #003566,
  #001d3d
);

    }

    /* 흐린 배경 이미지 */
    body::before {

      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 1200px;
      height: 1200px;

      background:
      url("https://raw.githubusercontent.com/22woodstock/10826yeonwoojung.github.io/main/ChatGPT%20Image%202026%EB%85%84%205%EC%9B%94%2021%EC%9D%BC%20%EC%98%A4%ED%9B%84%2005_18_50.png")
      center center no-repeat;

      background-size: contain;

      /* 흐리게 */
      opacity: 0.50;

      /* 윤곽 느낌 */
      filter: blur(2px);

      z-index: 0;
    }

    /* 글자가 배경 위로 오게 */
    h1, p, a {

      position: relative;

      z-index: 1;
    }

    /* 제목 */
    h1 {

      font-size: 50px;

      color: white;

      margin-bottom: 15px;
    }

    /* 부제목 */
    p {

      font-size: 24px;

      margin-bottom: 70px;

      color: white;
    }

    /* 버튼 */
    .project-btn {

      display: inline-block;

      padding: 18px 40px;

      background-color: #74c0fc;

      color: white;

      text-decoration: none;

      font-size: 24px;

      font-weight: bold;

      border-radius: 10px;

      transition: 0.2s;

      position: relative;

      z-index: 1;
    }

    /* 마우스 올렸을 때 */
    .project-btn:hover {

      background-color: #4dabf7;

      transform: scale(1.05);
    }

  </style>
</head>

<body>

  <h1>드 브루인 수열과 오일러 회로를 이용한 유전체 서열 복원 탐구</h1>

  <p>
    사이언스 아카이브 포트폴리오 10826 정연우
  </p>

  <a href="project.html" class="project-btn">
    프로젝트 보기
  </a>

</body>
</html>
